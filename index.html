<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>KARDEX Lab Ambiental - Panel Unico</title>
<style>
:root{
  --bg:#0d1820;--surface:#122030;--border:#1e3550;
  --accent:#00c2a0;--text:#e8edf2;--muted:#6b8fa8;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);
  display:flex;flex-direction:column;height:100vh;overflow:hidden;}
.topbar{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--surface);
  border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto;}
.brand{font-size:13px;font-weight:700;color:var(--accent);white-space:nowrap;margin-right:6px;
  display:flex;align-items:center;gap:6px;}
.brand small{color:var(--muted);font-weight:500;font-size:10px;}
.seltabs{display:flex;gap:4px;margin-left:auto;}
.seltab{display:flex;align-items:center;gap:6px;padding:8px 14px;border:1px solid var(--border);
  background:transparent;color:var(--muted);border-radius:10px;cursor:pointer;font-size:13px;
  font-weight:600;white-space:nowrap;transition:.15s;}
.seltab .i{font-size:15px;}
.seltab:hover{color:var(--text);border-color:var(--accent);}
.seltab.active{background:var(--accent);color:#04231d;border-color:var(--accent);}
.frames{flex:1;position:relative;min-height:0;}
.appframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--bg);}
.appframe.active{display:block;}
@media(max-width:560px){
  .brand small{display:none;}
  .seltab{padding:8px 10px;font-size:12px;}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">🔬 KARDEX <small>Lab Ambiental - tiempo real</small></div>
  <div class="seltabs">
    <button class="seltab active" data-app="reactivos" onclick="showApp('reactivos')"><span class="i">🧪</span>Reactivos</button>
    <button class="seltab" data-app="liquidos" onclick="showApp('liquidos')"><span class="i">💧</span>Líquidos</button>
    <button class="seltab" data-app="solidos" onclick="showApp('solidos')"><span class="i">⚗️</span>Sólidos</button>
  </div>
</div>

<div class="frames" id="frames">
  <iframe class="appframe active" id="frame-reactivos" data-app="reactivos" srcdoc="<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>KARDEX · Lab Ambiental</title>
<style>
:root{
  --bg:#0d1820;--surface:#122030;--card:#172840;--border:#1e3550;
  --accent:#00c2a0;--blue:#3b9dff;--warn:#f59e0b;--danger:#ef4444;
  --purple:#a78bfa;--text:#e8edf2;--muted:#6b8fa8;--green:#22c55e;--orange:#fb923c;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
/* LOADING */
.loading-screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:14px;}
.loading-screen.hidden{display:none;}
.spinner{width:44px;height:44px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-title{font-size:15px;font-weight:700;color:var(--text);}
.loading-msg{font-size:12px;color:var(--muted);text-align:center;max-width:260px;min-height:18px;}
.loading-err{font-size:11px;color:var(--danger);text-align:center;max-width:280px;display:none;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:8px;padding:8px 12px;margin-top:4px;}
.btn-skip{margin-top:8px;padding:8px 18px;background:var(--surface);border:1px solid var(--border);color:var(--muted);border-radius:8px;cursor:pointer;font-size:12px;display:none;}
/* SYNC BAR */
.sync-bar{display:flex;align-items:center;gap:8px;padding:5px 14px;background:var(--surface);border-bottom:1px solid var(--border);font-size:11px;}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex-shrink:0;}
.sync-dot.online{background:var(--green);animation:pulse 2s infinite;}
.sync-dot.saving{background:var(--warn);animation:pulse .4s infinite;}
.sync-dot.error{background:var(--danger);}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
.sync-label{color:var(--muted);flex:1;}
.sync-time{color:var(--muted);font-size:10px;}
/* NAV */
.nav{display:flex;background:var(--surface);border-bottom:2px solid var(--border);position:sticky;top:0;z-index:300;}
.nav-btn{flex:1;padding:11px 4px 8px;font-size:10px;font-weight:700;color:var(--muted);background:none;border:none;cursor:pointer;border-bottom:3px solid transparent;display:flex;flex-direction:column;align-items:center;gap:2px;}
.nav-btn .ico{font-size:16px;}
.nav-btn.active{color:var(--accent);border-bottom-color:var(--accent);}
.panel{display:none;}.panel.active{display:block;}
/* HEADER */
.hdr{background:linear-gradient(135deg,#071520,#0a1a0a);border-bottom:2px solid var(--accent);padding:13px 14px 10px;}
.hdr h1{font-size:13px;font-weight:800;}
.hdr p{font-size:11px;color:var(--muted);margin-top:3px;}
.hdr-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.chip{font-size:10px;padding:3px 8px;border-radius:20px;border:1px solid var(--border);color:var(--muted);}
.chip b{color:var(--accent);}
/* DASHBOARD */
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px;}
.dash-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;text-align:center;}
.dash-num{font-size:28px;font-weight:800;margin-bottom:4px;}
.dash-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
.dash-num.ok{color:var(--green);}.dash-num.warn{color:var(--warn);}.dash-num.bad{color:var(--danger);}.dash-num.blue{color:var(--blue);}.dash-num.white{color:var(--text);}
.alert-section{padding:0 12px 10px;}
.alert-title{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--warn);font-weight:700;padding:10px 0 6px;display:flex;align-items:center;gap:6px;}
.alert-title::after{content:'';flex:1;height:1px;background:var(--border);}
.alert-item{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:10px;padding:10px 12px;margin-bottom:6px;border-left:3px solid var(--warn);}
.alert-item.critical{border-left-color:var(--danger);background:rgba(239,68,68,.08);}
.alert-ico{font-size:18px;flex-shrink:0;}
.alert-info{flex:1;min-width:0;}
.alert-name{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.alert-sub{font-size:10px;color:var(--muted);margin-top:2px;}
.alert-stock{font-size:12px;font-weight:800;flex-shrink:0;}
.alert-stock.bad{color:var(--danger);}.alert-stock.warn{color:var(--warn);}
/* SEARCH */
.srow{padding:10px 12px 0;display:flex;gap:8px;}
.sw{position:relative;flex:1;}
.sw svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);}
input[type=search]{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:13px;padding:9px 10px 9px 34px;outline:none;-webkit-appearance:none;}
input[type=search]:focus{border-color:var(--accent);}
/* FTABS */
.ftabs{display:flex;gap:5px;overflow-x:auto;padding:8px 12px;scrollbar-width:none;}
.ftabs::-webkit-scrollbar{display:none;}
.ftab{font-size:11px;font-weight:700;padding:5px 11px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;white-space:nowrap;}
.ftab.active{background:var(--accent);color:#0d1820;border-color:var(--accent);}
/* STATS */
.stats{display:flex;background:var(--surface);border-bottom:1px solid var(--border);}
.sb{flex:1;padding:7px 4px;text-align:center;border-right:1px solid var(--border);}
.sb:last-child{border-right:none;}
.sn{font-size:18px;font-weight:800;}.sl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-top:1px;}
.sn.ok{color:var(--green);}.sn.warn{color:var(--warn);}.sn.bad{color:var(--danger);}.sn.blue{color:var(--blue);}
/* FORMS */
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;padding:8px 10px;outline:none;font-family:inherit;width:100%;-webkit-appearance:none;}
input:focus,select:focus,textarea:focus{border-color:var(--accent);}
select option{background:var(--card);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
.form-row.full{grid-template-columns:1fr;}
.fg{display:flex;flex-direction:column;gap:4px;}
.flbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:700;}
/* CARDS */
.cards{padding:10px;display:flex;flex-direction:column;gap:9px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
.card.c-ok{border-left:4px solid var(--green);}.card.c-warn{border-left:4px solid var(--warn);}.card.c-bad{border-left:4px solid var(--danger);}.card.c-crit{border-left:4px solid var(--orange);}
.chead{display:flex;align-items:center;gap:9px;padding:11px 13px;cursor:pointer;}
.cico{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.04);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.cmain{flex:1;min-width:0;}
.cname{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.csub{font-size:11px;color:var(--muted);margin-top:2px;display:flex;gap:5px;align-items:center;flex-wrap:wrap;}
.csub code{font-size:10px;background:rgba(255,255,255,.06);padding:1px 5px;border-radius:4px;}
.cright{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;}
.bdg{font-size:10px;font-weight:800;padding:3px 8px;border-radius:6px;white-space:nowrap;}
.bdg.ok{background:rgba(34,197,94,.15);color:var(--green);border:1px solid rgba(34,197,94,.3);}
.bdg.warn{background:rgba(245,158,11,.15);color:var(--warn);border:1px solid rgba(245,158,11,.3);}
.bdg.bad{background:rgba(239,68,68,.15);color:var(--danger);border:1px solid rgba(239,68,68,.3);}
.bdg.crit{background:rgba(251,146,60,.15);color:var(--orange);border:1px solid rgba(251,146,60,.3);}
.chev{color:var(--muted);font-size:14px;transition:transform .25s;margin-top:2px;}
.card.expanded .chev{transform:rotate(180deg);}
.stock-bar-wrap{padding:0 13px 8px;display:flex;align-items:center;gap:8px;}
.stock-bar-track{flex:1;height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;}
.stock-bar-fill{height:100%;border-radius:3px;}
.stock-bar-fill.ok{background:var(--green);}.stock-bar-fill.warn{background:var(--warn);}.stock-bar-fill.bad{background:var(--danger);}.stock-bar-fill.crit{background:var(--orange);}
.stock-bar-label{font-size:10px;color:var(--muted);white-space:nowrap;}
.cbody{display:none;border-top:1px solid var(--border);padding:12px 13px;}
.card.expanded .cbody{display:block;}
.stitle{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);font-weight:700;margin:10px 0 7px;display:flex;align-items:center;gap:6px;}
.stitle:first-child{margin-top:0;}
.stitle::after{content:'';flex:1;height:1px;background:var(--border);}
.igrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:8px;}
.icell{background:var(--surface);border-radius:8px;padding:7px 9px;}
.icell.full{grid-column:1/-1;}
.lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px;}
.val{font-size:12px;font-weight:600;}
.val.green{color:var(--green);}.val.warn{color:var(--warn);}.val.bad{color:var(--danger);}
/* LOTES */
.lotes-list{display:flex;flex-direction:column;gap:6px;margin-bottom:8px;}
.lote-row{background:var(--surface);border-radius:9px;padding:9px 11px;display:flex;align-items:center;gap:10px;}
.lote-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.lote-dot.ok{background:var(--green);}.lote-dot.warn{background:var(--warn);}.lote-dot.bad{background:var(--danger);}
.lote-info{flex:1;min-width:0;}
.lote-num{font-size:12px;font-weight:700;font-family:monospace;}
.lote-sub{font-size:10px;color:var(--muted);margin-top:2px;}
.lote-stock{font-size:14px;font-weight:800;flex-shrink:0;}
.lote-bar-track{height:4px;background:rgba(255,255,255,.07);border-radius:2px;margin-top:4px;overflow:hidden;}
.lote-bar-fill{height:100%;border-radius:2px;}
/* MOV TABLE */
.kmov-wrap{overflow-x:auto;margin-top:4px;}
table.kmov{width:100%;border-collapse:collapse;font-size:11px;min-width:480px;}
table.kmov th{background:rgba(255,255,255,.05);padding:6px 8px;text-align:left;font-size:9px;color:var(--muted);text-transform:uppercase;white-space:nowrap;}
table.kmov td{padding:6px 8px;border-top:1px solid var(--border);white-space:nowrap;}
table.kmov tr.entrada td:first-child{border-left:3px solid var(--green);}
table.kmov tr.salida td:first-child{border-left:3px solid var(--danger);}
table.kmov tr.baja td:first-child{border-left:3px solid var(--warn);}
.delta-pos{color:var(--green);font-weight:700;}.delta-neg{color:var(--danger);font-weight:700;}
.tipo-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;}
.tipo-badge.entrada{background:rgba(34,197,94,.15);color:var(--green);}
.tipo-badge.salida{background:rgba(239,68,68,.12);color:var(--danger);}
.tipo-badge.baja{background:rgba(245,158,11,.12);color:var(--warn);}
.tipo-badge.ajuste{background:rgba(59,157,255,.12);color:var(--blue);}
.cactions{display:flex;gap:7px;margin-top:10px;}
.btn-sm{padding:8px 12px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;border:none;flex:1;}
.btn-sm.entrada{background:rgba(34,197,94,.15);color:var(--green);border:1px solid rgba(34,197,94,.3);}
.btn-sm.salida{background:rgba(239,68,68,.12);color:var(--danger);border:1px solid rgba(239,68,68,.25);}
.btn-sm.edit{background:rgba(59,157,255,.12);color:var(--blue);border:1px solid rgba(59,157,255,.25);}
/* KARDEX FULL */
.mov-filter-row{display:flex;gap:6px;padding:8px 12px 0;overflow-x:auto;scrollbar-width:none;}
.mfil{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;white-space:nowrap;}
.mfil.active{background:var(--blue);color:#fff;border-color:var(--blue);}
.kmov-full-wrap{padding:10px 12px;overflow-x:auto;}
table.kmov-full{width:100%;border-collapse:collapse;font-size:11px;min-width:600px;}
table.kmov-full th{background:rgba(255,255,255,.05);padding:7px 8px;text-align:left;font-size:9px;color:var(--muted);text-transform:uppercase;white-space:nowrap;}
table.kmov-full td{padding:7px 8px;border-top:1px solid var(--border);}
.pager{display:flex;align-items:center;justify-content:center;gap:10px;padding:10px;font-size:12px;color:var(--muted);}
.pager button{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:6px 14px;cursor:pointer;font-size:12px;font-weight:700;}
.pager button:disabled{opacity:.3;cursor:not-allowed;}
/* MOV FORM */
.qmove{background:var(--card);border:1px solid var(--border);border-radius:14px;margin:12px;padding:14px;}
.qmove-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin-bottom:10px;}
.lote-selector{display:flex;flex-direction:column;gap:6px;margin-top:4px;}
.lote-opt{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--border);border-radius:10px;padding:10px 12px;cursor:pointer;transition:border-color .2s;}
.lote-opt:hover{border-color:var(--accent);}
.lote-opt.selected{border-color:var(--accent);background:rgba(0,194,160,.08);}
.lote-opt-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.lote-opt-info{flex:1;min-width:0;}
.lote-opt-num{font-size:13px;font-weight:700;font-family:monospace;}
.lote-opt-sub{font-size:10px;color:var(--muted);margin-top:2px;}
.lote-opt-stock{font-size:14px;font-weight:800;flex-shrink:0;}
.lote-opt-bar{height:3px;background:rgba(255,255,255,.07);border-radius:2px;margin-top:5px;overflow:hidden;}
.lote-opt-bar-fill{height:100%;border-radius:2px;}
.no-lotes-msg{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:10px;padding:12px;font-size:12px;color:var(--danger);text-align:center;}
.stock-preview{background:var(--surface);border-radius:10px;padding:12px;margin-top:8px;display:none;border:1px solid var(--border);}
.sp-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;font-weight:700;}
.sp-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
.sp-val{font-size:14px;font-weight:800;}
.sp-warn{font-size:11px;color:var(--danger);margin-top:6px;display:none;}
.move-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
.btn-move{padding:12px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;border:none;}
.btn-move:active{opacity:.8;}
.btn-move.entrada{background:rgba(34,197,94,.2);color:var(--green);border:1px solid rgba(34,197,94,.4);}
.btn-move.salida{background:rgba(239,68,68,.15);color:var(--danger);border:1px solid rgba(239,68,68,.3);}
.btn-move.baja{background:rgba(245,158,11,.15);color:var(--warn);border:1px solid rgba(245,158,11,.3);}
.btn-move.ajuste{background:rgba(59,157,255,.15);color:var(--blue);border:1px solid rgba(59,157,255,.3);}
/* MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:500;overflow-y:auto;}
.overlay.open{display:block;}
.modal{background:var(--card);border-radius:18px 18px 0 0;margin-top:40px;min-height:calc(100vh - 40px);}
.mhdr{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;position:sticky;top:0;background:var(--card);z-index:10;border-radius:18px 18px 0 0;}
.mhdr h2{flex:1;font-size:15px;font-weight:700;}
.btn-close{background:none;border:none;color:var(--muted);font-size:24px;cursor:pointer;}
.mbody{padding:14px;padding-bottom:100px;}
.fsep{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700;padding:8px 0 6px;border-bottom:1px solid var(--border);margin-bottom:10px;}
.mfoot{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--border);position:sticky;bottom:0;background:var(--card);}
.btn-primary{background:var(--accent);color:#0d1820;flex:1;padding:12px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;border:none;}
.btn-danger{background:rgba(239,68,68,.15);color:var(--danger);border:1px solid rgba(239,68,68,.3);padding:12px 16px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;}
.btn-ghost{background:var(--surface);color:var(--muted);border:1px solid var(--border);padding:12px 16px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--accent);color:#0d1820;padding:10px 20px;border-radius:30px;font-weight:700;font-size:13px;z-index:999;transition:transform .3s;pointer-events:none;white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);}
.fab{position:fixed;bottom:20px;right:16px;width:52px;height:52px;border-radius:50%;background:var(--accent);color:#0d1820;font-size:26px;border:none;cursor:pointer;box-shadow:0 4px 20px rgba(0,194,160,.4);z-index:200;display:flex;align-items:center;justify-content:center;}
.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px;}

/* EDIT MOV MODAL */
.bdg-edit{font-size:10px;font-weight:700;padding:2px 8px;border-radius:5px;background:rgba(59,157,255,.15);color:var(--blue);border:1px solid rgba(59,157,255,.3);cursor:pointer;margin-left:6px;}
.bdg-edit:active{opacity:.7;}

function hoy() { return new Date().toISOString().slice(0,10); }
function fmtDate(s) {
  if (!s) return '—';
  if (typeof s === 'string' && s.includes('/')) return s;
  try { const [y,m,d] = s.split('-'); return `${d}/${m}/${y}`; } catch(e) { return s; }
}
function fechaOrden(f) {
  if (!f) return 0;
  if (typeof f !== 'string') {
    const d = new Date(f);
    return isNaN(d) ? 0 : d.getTime();
  }
  const s = f.trim();
  if (s.includes('/')) {
    const p = s.split('/');
    if (p.length === 3) return new Date(Number(p[2]), Number(p[1]) - 1, Number(p[0])).getTime();
  }
  if (s.includes('-')) {
    const p = s.split('-');
    if (p.length === 3) return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2])).getTime();
  }
  const d = new Date(s);
  return isNaN(d) ? 0 : d.getTime();
}
function stockStatus(item) {
  const s = Number(item.stock)||0, mn = Number(item.stock_min)||0;
  if (s <= 0) return 'bad';
  if (mn > 0 && s < mn * 0.5) return 'crit';
  if (mn > 0 && s < mn) return 'warn';
  return 'ok';
}
function stockBdg(item) {
  const st = stockStatus(item);
  const labels = {ok:'✅ OK', warn:'🟡 Stock bajo', crit:'🔴 Crítico', bad:'⛔ Sin stock'};
  return `<div class="bdg ${st}">${labels[st]}</div>`;
}
function loteColor(st) {
  return {ok:'var(--green)',warn:'var(--warn)',crit:'var(--orange)',bad:'var(--danger)'}[st]||'var(--muted)';
}
function loteStatus(saldo, inicial) {
  if (Number(saldo) <= 0) return 'bad';
  const p = Number(inicial) > 0 ? Number(saldo)/Number(inicial) : 1;
  if (p < 0.2) return 'crit';
  if (p < 0.5) return 'warn';
  return 'ok';
}
function recalcFromMovs() {
  // Get lote saldo from movement — handles all 3 modules
  function getLoteSaldo(m) {
    if (m.stock_ml !== undefined && m.stock_ml !== null) return Number(m.stock_ml);
    if (m.stock_g  !== undefined && m.stock_g  !== null) return Number(m.stock_g);
    if (m.saldo_lote !== undefined && m.saldo_lote !== null) return Number(m.saldo_lote);
    return 0;
  }
  function getCodigoSaldo(m) {
    if (m.stock_acum !== undefined && m.stock_acum !== null) return Number(m.stock_acum);
    if (m.saldo_codigo !== undefined && m.saldo_codigo !== null) return Number(m.saldo_codigo);
    return null;
  }

  const loteSaldoMap   = {};
  const loteNumMap     = {};
  const codigoSaldoMap = {};

  // Sort ASC by date so last write = most recent
  [...MOVS].sort((a,b) => fechaOrden(a.fecha) - fechaOrden(b.fecha)).forEach(m => {
    const cod = m.codigo; if (!cod) return;
    const cs = getCodigoSaldo(m);
    if (cs !== null) codigoSaldoMap[cod] = cs;
    if (m.clave) {
      const saldo = getLoteSaldo(m);
      const entry = { saldo, lote: m.lote, codigo: cod, reactivo: m.reactivo, fecha: m.fecha };
      loteSaldoMap[m.clave] = entry;
      const key = cod + '|' + m.lote;
      if (!loteNumMap[key] || fechaOrden(m.fecha) >= fechaOrden(loteNumMap[key].fecha||'')) {
        loteNumMap[key] = entry;
      }
    }
  });

  // Update INV.stock from codigoSaldoMap
  INV.forEach(item => {
    if (codigoSaldoMap[item.codigo] !== undefined) item.stock = codigoSaldoMap[item.codigo];
  });

  // Rebuild LOTES from SEED_LOTES updating saldos from movements
  LOTES = {};
  Object.entries(SEED_LOTES).forEach(([cod, seedLotes]) => {
    LOTES[cod] = seedLotes.map(sl => {
      const byExact   = loteSaldoMap[sl.clave];
      const byLoteNum = loteNumMap[cod + '|' + sl.lote];
      let best;
      if (byExact && byLoteNum) {
        best = fechaOrden(byExact.fecha) >= fechaOrden(byLoteNum.fecha) ? byExact : byLoteNum;
      } else {
        best = byExact || byLoteNum;
      }
      const saldo = best !== undefined ? best.saldo : (sl.saldo ?? 0);
      return { ...sl, saldo: Math.round(saldo*1000)/1000, fecha_ultimo: best?.fecha||sl.fecha_ultimo||'', agotado: saldo <= 0 };
    });
    LOTES[cod].sort((a,b) => (a.agotado?1:0)-(b.agotado?1:0) || b.saldo-a.saldo);
  });

  // SUM active lote saldos = definitive stock total
  INV.forEach(item => {
    const myLotes = LOTES[item.codigo]||[];
    if (myLotes.length > 0) {
      item.stock = Math.round(myLotes.filter(l=>!l.agotado).reduce((a,l)=>a+(l.saldo||0),0)*100)/100;
    }
  });

  // Add new lotes from movements not in seed
  Object.entries(loteNumMap).forEach(([key, data]) => {
    const cod = data.codigo;
    if (!LOTES[cod]) LOTES[cod] = [];
    const existsByLote = LOTES[cod].find(l => l.lote === data.lote);
    if (!existsByLote && data.saldo > 0) {
      LOTES[cod].push({ clave: cod+'|'+data.lote, lote: data.lote, saldo: data.saldo, fecha_ultimo: data.fecha, agotado: false });
      LOTES[cod].sort((a,b) => (a.agotado?1:0)-(b.agotado?1:0)||b.saldo-a.saldo);
      // Recalc stock after adding new lote
      const myLotes = LOTES[cod];
      const item = INV.find(i=>i.codigo===cod);
      if (item) item.stock = Math.round(myLotes.filter(l=>!l.agotado).reduce((a,l)=>a+(l.saldo||0),0)*100)/100;
    }
  });
}

function renderDash() {
  const ok   = INV.filter(i=>stockStatus(i)==='ok').length;
  const warn = INV.filter(i=>stockStatus(i)==='warn').length;
  const crit = INV.filter(i=>stockStatus(i)==='crit').length;
  const bad  = INV.filter(i=>stockStatus(i)==='bad').length;
  const ent  = MOVS.filter(m=>m.tipo==='Entrada').reduce((a,m)=>a+(Number(m.cantidad)||0),0);
  const sal  = MOVS.filter(m=>m.tipo==='Salida').reduce((a,m)=>a+(Number(m.cantidad)||0),0);
  const totalLotes = Object.values(LOTES).reduce((a,v)=>a+v.length,0);
  document.getElementById('d-total').textContent = INV.length;
  document.getElementById('d-movs').textContent  = MOVS.length;
  document.getElementById('d-lotes').textContent = totalLotes;
  document.getElementById('dash-grid').innerHTML = `
    <div class="dash-card"><div class="dash-num ok">${ok}</div><div class="dash-lbl">✅ Stock OK</div></div>
    <div class="dash-card"><div class="dash-num warn">${warn}</div><div class="dash-lbl">🟡 Stock bajo</div></div>
    <div class="dash-card"><div class="dash-num bad">${crit + bad}</div><div class="dash-lbl">🔴 Crítico / Sin stock</div></div>
    <div class="dash-card"><div class="dash-num blue">${ent.toLocaleString()}</div><div class="dash-lbl">📥 Entradas acum.</div></div>
    <div class="dash-card"><div class="dash-num white">${sal.toLocaleString()}</div><div class="dash-lbl">📤 Salidas acum.</div></div>
    <div class="dash-card"><div class="dash-num blue">${totalLotes}</div><div class="dash-lbl">📦 Lotes activos</div></div>
    <div class="dash-card"><div class="dash-num white">${MOVS.length}</div><div class="dash-lbl">📋 Movimientos</div></div>
    <div class="dash-card"><div class="dash-num blue">${INV.length}</div><div class="dash-lbl">🧪 Reactivos</div></div>`;
  const alerts = INV.filter(i=>['crit','warn','bad'].includes(stockStatus(i))).sort((a,b)=>(Number(a.stock)||0)-(Number(b.stock)||0));
  const al = document.getElementById('alertas-list');
  if (!alerts.length) { al.innerHTML='<div class="empty">✅ Sin alertas — todos los stocks están bien</div>'; return; }
  al.innerHTML = alerts.map(i => {
    const st=stockStatus(i);
    const pct=Number(i.stock_min)>0?Math.round(((Number(i.stock)||0)/Number(i.stock_min))*100):0;
    return `<div class="alert-item ${st==='bad'||st==='crit'?'critical':''}">
      <div class="alert-ico">${st==='bad'?'⛔':st==='crit'?'🚨':'🟡'}</div>
      <div class="alert-info">
        <div class="alert-name">${i.reactivo}</div>
        <div class="alert-sub">${i.codigo} · Mín: ${i.stock_min} ${i.unidad} · ${pct}% del mínimo</div>
      </div>
      <div class="alert-stock ${st==='bad'||st==='crit'?'bad':'warn'}">${Number(i.stock)||0} ${i.unidad}</div>
    </div>`;
  }).join('');
}

function renderKardex() {
  const q=(document.getElementById('kard-q').value||'').toLowerCase();
  const filtered=MOVS.filter(m=>{
    const fOk=kardexFilter==='Todos'||m.tipo===kardexFilter;
    const qOk=!q||(m.reactivo||'').toLowerCase().includes(q)||(m.codigo||'').toLowerCase().includes(q)||(m.lote||'').toLowerCase().includes(q)||(m.doc||'').toLowerCase().includes(q);
    return fOk&&qOk;
  });
  filtered.sort((a,b)=>fechaOrden(b.fecha)-fechaOrden(a.fecha));
  const total=filtered.length;
  const page=filtered.slice(kardexPage*PER_PAGE,(kardexPage+1)*PER_PAGE);
  const wrap=document.getElementById('kardex-table-wrap');
  if(!page.length){wrap.innerHTML='<div class="empty">Sin movimientos</div>';document.getElementById('kardex-pager').innerHTML='';return;}
  wrap.innerHTML=`<table class="kmov-full">
    <thead><tr><th>Fecha</th><th>Reactivo</th><th>Lote</th><th>Tipo</th><th>Cant.</th><th>Δ</th><th>Saldo</th><th>Doc.</th><th>Resp.</th><th></th></tr></thead>
    <tbody>${page.map(m=>{
      const tc=m.tipo.toLowerCase().includes('entrada')?'entrada':m.tipo.toLowerCase().includes('salida')?'salida':m.tipo.toLowerCase().includes('baja')?'baja':'ajuste';
      const d=Number(m.delta)||0;
      const fid = m._fid||'';
      return `<tr>
        <td>${m.fecha}</td>
        <td style="font-weight:600;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${m.reactivo}</td>
        <td><code style="color:var(--purple)">${m.lote}</code></td>
        <td><span class="tipo-badge ${tc}">${m.tipo}</span></td>
        <td style="font-weight:700">${m.cantidad}</td>
        <td class="${d>=0?'delta-pos':'delta-neg'}">${d>=0?'+':''}${d}</td>
        <td style="font-weight:700">${Number(m.saldo_lote)||0}</td>
        <td style="color:var(--muted);font-size:10px">${m.doc||'—'}</td>
        <td style="color:var(--muted)">${m.responsable}</td>
        <td style="white-space:nowrap">
          <button class="bdg-edit" onclick="openEditMov('${fid}')">✏️</button>
          <button class="bdg-del"  onclick="confirmDelMov('${fid}','${m.reactivo}')">🗑</button>
        </td>
      </tr>`;
    }).join('')}</tbody></table>`;
  const totalPages=Math.ceil(total/PER_PAGE);
  const pager=document.getElementById('kardex-pager');
  pager.innerHTML='';
  const prev=document.createElement('button');
  prev.textContent='◀'; prev.disabled=kardexPage===0;
  prev.addEventListener('click',()=>{kardexPage--;renderKardex();});
  const info=document.createElement('span');
  info.textContent=`Pág ${kardexPage+1} / ${totalPages} · ${total} registros`;
  const next=document.createElement('button');
  next.textContent='▶'; next.disabled=kardexPage>=totalPages-1;
  next.addEventListener('click',()=>{kardexPage++;renderKardex();});
  pager.append(prev,info,next);
}

function initMovForm() {
  const sel=document.getElementById('m-reactivo');
  sel.innerHTML='<option value="">— Selecciona —</option>';
  [...INV].sort((a,b)=>(a.reactivo||'').localeCompare(b.reactivo||'')).forEach(i=>{
    const o=document.createElement('option');
    o.value=i.codigo;
    const st=stockStatus(i);
    const icon=st==='ok'?'✅':st==='warn'?'🟡':st==='crit'?'🔴':'⛔';
    o.textContent=`${icon} ${i.codigo} · ${i.reactivo} (${Number(i.stock)||0} ${i.unidad})`;
    sel.appendChild(o);
  });
  document.getElementById('m-fecha').value=hoy();
  document.getElementById('lote-section').style.display='none';
  document.getElementById('mov-section').style.display='none';
  document.getElementById('stock-preview').style.display='none';
  selectedLote=null;
}
function onReactivoChange() {
  const cod=document.getElementById('m-reactivo').value;
  selectedLote=null;
  if(!cod){
    document.getElementById('lote-section').style.display='none';
    document.getElementById('mov-section').style.display='none';
    return;
  }
  document.getElementById('lote-section').style.display='';
  document.getElementById('mov-section').style.display='';
  renderLoteSelector(cod);
  document.getElementById('stock-preview').style.display='none';
}
function renderLoteSelector(cod) {
  const item=INV.find(i=>i.codigo===cod);
  const lotes=LOTES[cod]||[];
  const sel=document.getElementById('lote-selector');
  if(!lotes.length){
    sel.innerHTML=`<div class="no-lotes-msg">⚠️ <b>Sin lotes registrados</b><br><span style="font-size:11px;display:block;margin-top:4px">Ingresa el número de lote nuevo abajo para registrar una Entrada.</span></div>`;
    return;
  }
  sel.innerHTML='';
  lotes.forEach((l,idx)=>{
    const st=loteStatus(l.saldo,l.cant_inicial||l.presentacion);
    const pct=(l.cant_inicial||l.presentacion)>0?Math.min(100,Math.round((l.saldo/(l.cant_inicial||l.presentacion))*100)):50;
    const div=document.createElement('div');
    div.className='lote-opt';
    div.id='lote-opt-'+idx;
    const isAgotado = l.agotado || Number(l.saldo) <= 0;
    if(isAgotado) div.style.opacity='0.45';
    div.innerHTML=`
      <div class="lote-opt-dot" style="background:${isAgotado?'var(--muted)':loteColor(st)}"></div>
      <div class="lote-opt-info">
        <div class="lote-opt-num">Lote: <b>${l.lote}</b> ${isAgotado?'<span style="font-size:9px;color:var(--muted);font-weight:400">(agotado)</span>':''}</div>
        <div class="lote-opt-sub">Última mov: ${l.fecha_ultimo||'—'}${l.marca?' · '+l.marca:''}</div>
        <div class="lote-opt-bar"><div class="lote-opt-bar-fill" style="width:${isAgotado?0:pct}%;background:${loteColor(st)}"></div></div>
      </div>
      <div>
        <div class="lote-opt-stock" style="color:${isAgotado?'var(--muted)':loteColor(st)};font-size:${isAgotado?'12':'14'}px">${Number(l.saldo)||0}</div>
        <div style="font-size:9px;color:var(--muted);text-align:right">${item?.unidad||''}</div>
      </div>`;
    div.addEventListener('click',()=>{
      if(isAgotado){toast('⚠️ Este lote está agotado — usa el campo de lote nuevo para una Entrada','var(--warn)');return;}
      selectedLote=lotes[idx];
      document.querySelectorAll('.lote-opt').forEach((el,i)=>el.classList.toggle('selected',i===idx));
      document.getElementById('m-lote-manual').value='';
      updatePreview();
    });
    sel.appendChild(div);
  });
}
function updatePreview() {
  const cod=document.getElementById('m-reactivo').value;
  const item=INV.find(i=>i.codigo===cod);
  if(!item){document.getElementById('stock-preview').style.display='none';return;}
  const loteManual=document.getElementById('m-lote-manual').value.trim();
  const activeLote=loteManual?null:selectedLote;
  const cant=Number(document.getElementById('m-cantidad').value)||0;
  const tipo=document.getElementById('m-tipo').value;
  const isNeg=tipo.toLowerCase().includes('salida')||tipo.toLowerCase().includes('baja')||tipo.toLowerCase().includes('traslado');
  const delta=isNeg?-cant:cant;
  const loteSaldo=activeLote?Number(activeLote.saldo):0;
  const afterLote=activeLote?loteSaldo+delta:cant;
  const afterTotal=(Number(item.stock)||0)+delta;
  document.getElementById('stock-preview').style.display=cant>0?'':'none';
  if(cant<=0)return;
  document.getElementById('sp-lote').textContent=activeLote?`${loteSaldo} ${item.unidad}`:(loteManual?`Nuevo: ${loteManual}`:'— selecciona lote');
  document.getElementById('sp-total').textContent=`${Number(item.stock)||0} ${item.unidad}`;
  document.getElementById('sp-despues').textContent=`${afterLote} ${item.unidad} (lote) / ${afterTotal} ${item.unidad} (total)`;
  document.getElementById('sp-despues').style.color=afterTotal<(Number(item.stock_min)||0)?'var(--danger)':afterTotal<0?'var(--orange)':'var(--green)';
  document.getElementById('sp-warn').style.display=(afterTotal<(Number(item.stock_min)||0)&&afterTotal>=0)?'':'none';
  document.getElementById('sp-neg').style.display=(isNeg&&activeLote&&cant>loteSaldo)?'':'none';
}
async function registrarMovimiento(tipoForzado) {
  const cod=document.getElementById('m-reactivo').value;
  if(!cod){toast('⚠️ Selecciona un reactivo','var(--danger)');return;}
  const cant=Number(document.getElementById('m-cantidad').value);
  if(!cant||cant<=0){toast('⚠️ Ingresa una cantidad válida','var(--danger)');return;}
  const tipo=tipoForzado;
  const item=INV.find(i=>i.codigo===cod);
  const isNeg=tipo.toLowerCase().includes('salida')||tipo.toLowerCase().includes('baja')||tipo.toLowerCase().includes('traslado');
  const loteManual=document.getElementById('m-lote-manual').value.trim();
  const lote=loteManual||(selectedLote?selectedLote.lote:'');
  if(!lote){toast('⚠️ Selecciona o ingresa un número de lote','var(--danger)');return;}
  const loteSaldo=Number(selectedLote?.saldo)||0;
  if(isNeg&&selectedLote&&cant>loteSaldo){if(!confirm(`⚠️ El lote ${lote} tiene ${loteSaldo} unidades. ¿Continuar?`))return;}
  const delta=isNeg?-cant:cant;
  const newLote=(selectedLote?loteSaldo:0)+delta;
  const newTotal=(Number(item.stock)||0)+delta;
  const mov={
    clave:`${cod}|${lote}`, codigo:cod, reactivo:item.reactivo, lote,
    fecha:fmtDate(document.getElementById('m-fecha').value),
    tipo, cantidad:cant,
    responsable:document.getElementById('m-resp').value.trim()||'Sistema',
    doc:document.getElementById('m-doc').value.trim(),
    area:document.getElementById('m-area').value.trim(),

async function saveReactivo() {

// ============================================================
// FIREBASE SEED + LISTENERS
// ============================================================
async function seedIfEmpty() {
  setMsg('Verificando base de datos...');
  const snap = await db.collection('inventario').get();
  if (snap.empty) {
    setMsg('Primera vez — cargando datos iniciales...');
    // Upload inventory
    const batch = db.batch();
    SEED_INV.forEach(item => {
      batch.set(db.collection('inventario').doc(item.codigo), item);
    });
    await batch.commit();
    setMsg('Cargando historial de movimientos (puede tardar ~30s)...');
    // Upload movements in chunks of 400
    for (let i=0; i<SEED_MOVS.length; i+=400) {
      const b2 = db.batch();
      SEED_MOVS.slice(i,i+400).forEach((m,j) => {
        const id = 'mov_'+String(i+j).padStart(6,'0');
        b2.set(db.collection('movimientos').doc(id), m);
      });
      await b2.commit();
      setMsg(`Cargando movimientos... ${Math.min(i+400,SEED_MOVS.length)}/${SEED_MOVS.length}`);
    }
    toast('✅ Datos cargados correctamente');
  }
}

function startListeners() {
  setMsg('Iniciando sincronización en tiempo real...');
  // Inventario listener
  db.collection('inventario').onSnapshot(snap => {
    INV = snap.docs.map(d => ({...d.data(), _id:d.id}));
    INV.sort((a,b)=>(a.reactivo||'').localeCompare(b.reactivo||''));
    recalcFromMovs();
    setSyncStatus('online','🟢 En línea · Tiempo real');
    const active=document.querySelector('.panel.active');
    if(active) {
      const id=active.id.replace('panel-','');
      if(id==='dash') renderDash();
      if(id==='inv')  renderInv();
    }
  }, err => {
    console.error('Inventario listener error:', err);
    setSyncStatus('error','❌ Error de conexión: '+err.code);
  });

  // Movimientos listener
  db.collection('movimientos').orderBy('fecha','desc').onSnapshot(snap => {
    MOVS = snap.docs.map(d => ({...d.data(), _fid:d.id}));
    recalcFromMovs();
    const active=document.querySelector('.panel.active');
    if(active) {
      const id=active.id.replace('panel-','');
      if(id==='dash')   renderDash();
      if(id==='inv')    renderInv();
      if(id==='kardex') renderKardex();
    }
  }, err => {
    console.error('Movimientos listener error:', err);
  });
}

// ============================================================
// INIT
// ============================================================
async function init() {
  try {
    setMsg('Conectando a Firebase...');
    await seedIfEmpty();
    startListeners();
    // Wait for first data load then hide loading
    setTimeout(() => {
      document.getElementById('loading').classList.add('hidden');
      renderDash();
      initMovForm();
    }, 2500);
  } catch(e) {
    console.error('Init error:', e);
    setErr('Error: ' + e.message + ' (código: ' + (e.code||'desconocido') + ')');
    setSyncStatus('error','❌ Sin conexión');
  }
}

init();

// ============================================================
let editMovFid = null;

function openEditMov(fid) {
  const mov = MOVS.find(m => m._fid === fid);
  if (!mov) { toast('⚠️ Movimiento no encontrado', 'var(--danger)'); return; }
  editMovFid = fid;
  document.getElementById('em-reactivo').value = mov.reactivo || '';
  document.getElementById('em-lote').value     = mov.lote || '';
  document.getElementById('em-tipo').value     = mov.tipo || 'Salida';
  document.getElementById('em-cantidad').value = mov.cantidad || '';
  document.getElementById('em-resp').value     = mov.responsable || '';
  document.getElementById('em-doc').value      = mov.doc || '';
  document.getElementById('em-obs').value      = mov.obs || '';
  // Convert fecha DD/MM/YYYY or YYYY-MM-DD to input date format
  const f = mov.fecha || '';
  if (f.includes('/')) {
    const [d,m,y] = f.split('/');
    document.getElementById('em-fecha').value = `${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`;
  } else {
    document.getElementById('em-fecha').value = f;
  }
  document.getElementById('ov-editmov').classList.add('open');
}
window.openEditMov = openEditMov;

function closeEditMov() { document.getElementById('ov-editmov').classList.remove('open'); }

async function saveEditMov() {
  if (!editMovFid) return;
  const cant = Number(document.getElementById('em-cantidad').value);
  if (!cant || cant <= 0) { toast('⚠️ Cantidad inválida', 'var(--danger)'); return; }
  const fechaRaw = document.getElementById('em-fecha').value;
  const [y,m,d] = fechaRaw.split('-');
  const fechaFmt = `${d}/${m}/${y}`;
  const tipo = document.getElementById('em-tipo').value;
  const isNeg = tipo.toLowerCase().includes('salida')||tipo.toLowerCase().includes('baja')||tipo.toLowerCase().includes('traslado');
  const delta = isNeg ? -cant : cant;
  const updates = {
    fecha:       fechaFmt,
    lote:        document.getElementById('em-lote').value.trim(),
    tipo,
    cantidad:    cant,
    responsable: document.getElementById('em-resp').value.trim(),
    doc:         document.getElementById('em-doc').value.trim(),
    obs:         document.getElementById('em-obs').value.trim(),
    delta,
  };
  setSyncStatus('saving','☁️ Guardando...');
  try {
    await db.collection('movimientos').doc(editMovFid).update(updates);
    toast('✅ Movimiento actualizado');
    closeEditMov();
  } catch(e) {
    toast('❌ Error: '+e.message, 'var(--danger)');
    setSyncStatus('error','❌ Error');
  }
}

  setSyncStatus('saving','☁️ Eliminando...');

// EXPORT CSV / POR MES
// ============================================================
let exportYear = new Date().getFullYear();
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

function buildMesGrid() {
  document.getElementById('year-lbl').textContent = exportYear;
  const grid = document.getElementById('mes-grid');
  grid.innerHTML = '';
  MESES.forEach((mes, idx) => {
    const btn = document.createElement('button');
    btn.className = 'mes-btn';
    btn.textContent = mes.slice(0,3);
    btn.addEventListener('click', () => exportMes(exportYear, idx+1, mes));
    grid.appendChild(btn);
  });
}

document.getElementById('btn-exp-mes').addEventListener('click', () => {
  const picker = document.getElementById('mes-picker');
  picker.classList.toggle('open');
  if (picker.classList.contains('open')) buildMesGrid();
});
document.getElementById('year-prev').addEventListener('click', () => { exportYear--; buildMesGrid(); });
document.getElementById('year-next').addEventListener('click', () => { exportYear++; buildMesGrid(); });
document.getElementById('btn-exp-todo').addEventListener('click', exportTodoCSV);

function movToCSVRow(m) {
  const esc = v => `"${String(v||'').replace(/"/g,'""')}"`;
  return [m.fecha, m.reactivo, m.codigo, m.lote, m.tipo, m.cantidad, m.delta||0, m.saldo_lote||0, m.doc||'', m.area||'', m.responsable, m.obs||''].map(esc).join(',');
}

function downloadCSV(content, filename) {
  const BOM = '\uFEFF'; // UTF-8 BOM for Excel
  const blob = new Blob([BOM + content], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
}

function exportMes(year, mes, mesNombre) {
  const filtrados = MOVS.filter(m => {
    const f = m.fecha || '';
    // Support DD/MM/YYYY and YYYY-MM-DD
    let y, mo;
    if (f.includes('/')) { const p=f.split('/'); y=+p[2]; mo=+p[1]; }
    else if (f.includes('-')) { const p=f.split('-'); y=+p[0]; mo=+p[1]; }
    else return false;
    return y === year && mo === mes;
  });
  if (!filtrados.length) { toast(`⚠️ Sin movimientos en ${mesNombre} ${year}`, 'var(--warn)'); return; }
  const header = 'FECHA,REACTIVO,CÓDIGO,LOTE,TIPO,CANTIDAD,DELTA,SALDO LOTE,DOCUMENTO,ÁREA,RESPONSABLE,OBSERVACIÓN';
  const rows = filtrados.map(movToCSVRow).join('\n');
  // Summary by reactivo
  const resumen = {};
  filtrados.forEach(m => {
    if (!resumen[m.reactivo]) resumen[m.reactivo] = {entradas:0, salidas:0, bajas:0};
    const t = (m.tipo||'').toLowerCase();
    if (t.includes('entrada')) resumen[m.reactivo].entradas += Number(m.cantidad)||0;
    else if (t.includes('salida')||t.includes('traslado')) resumen[m.reactivo].salidas += Number(m.cantidad)||0;
    else if (t.includes('baja')) resumen[m.reactivo].bajas += Number(m.cantidad)||0;
  });
  const resHeader = '\n\nRESUMEN POR REACTIVO\nREACTIVO,ENTRADAS,SALIDAS,BAJAS,CONSUMO NETO';
  const resRows = Object.entries(resumen).map(([r,v]) =>
    `"${r}",${v.entradas},${v.salidas},${v.bajas},${v.salidas+v.bajas}`
  ).join('\n');
  const content = header + '\n' + rows + resHeader + '\n' + resRows;
  downloadCSV(content, `Kardex_${mesNombre}_${year}.csv`);
  toast(`✅ Exportado: ${filtrados.length} movimientos de ${mesNombre} ${year}`);
  document.getElementById('mes-picker').classList.remove('open');
}

function exportTodoCSV() {
  const q = (document.getElementById('kard-q').value||'').toLowerCase();
  const filtrados = MOVS.filter(m => {
    const fOk = kardexFilter==='Todos'||m.tipo===kardexFilter;
    const qOk = !q||(m.reactivo||'').toLowerCase().includes(q)||(m.codigo||'').toLowerCase().includes(q)||(m.lote||'').toLowerCase().includes(q);
    return fOk && qOk;
  });
  if (!filtrados.length) { toast('⚠️ Sin movimientos para exportar', 'var(--warn)'); return; }
  const header = 'FECHA,REACTIVO,CÓDIGO,LOTE,TIPO,CANTIDAD,DELTA,SALDO LOTE,DOCUMENTO,ÁREA,RESPONSABLE,OBSERVACIÓN';
  const rows = filtrados.map(movToCSVRow).join('\n');
  downloadCSV(header + '\n' + rows, `Kardex_Completo_${new Date().toISOString().slice(0,10)}.csv`);
  toast(`✅ Exportado: ${filtrados.length} movimientos`);
}

.clasif-badge{font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;white-space:nowrap;}
.clasif-INF{background:rgba(251,146,60,.2);color:var(--orange);}
.clasif-COR{background:rgba(239,68,68,.15);color:var(--danger);}
.clasif-TOX{background:rgba(167,139,250,.2);color:var(--purple);}
.clasif-NOC{background:rgba(245,158,11,.15);color:var(--warn);}
.clasif-OXI{background:rgba(59,157,255,.15);color:var(--blue);}
.clasif-NOP{background:rgba(34,197,94,.15);color:var(--green);}
/* CARDS */
.cards{padding:10px;display:flex;flex-direction:column;gap:9px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
.card.c-ok{border-left:4px solid var(--green);}.card.c-warn{border-left:4px solid var(--warn);}.card.c-bad{border-left:4px solid var(--danger);}.card.c-crit{border-left:4px solid var(--orange);}
.chead{display:flex;align-items:center;gap:9px;padding:11px 13px;cursor:pointer;}
.cico{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.04);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.cmain{flex:1;min-width:0;}
.cname{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.csub{font-size:11px;color:var(--muted);margin-top:2px;display:flex;gap:5px;align-items:center;flex-wrap:wrap;}
.csub code{font-size:10px;background:rgba(255,255,255,.06);padding:1px 5px;border-radius:4px;}
.cright{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0;}
.bdg{font-size:10px;font-weight:800;padding:3px 8px;border-radius:6px;white-space:nowrap;}
.bdg.ok{background:rgba(34,197,94,.15);color:var(--green);border:1px solid rgba(34,197,94,.3);}
.bdg.warn{background:rgba(245,158,11,.15);color:var(--warn);border:1px solid rgba(245,158,11,.3);}
.bdg.bad{background:rgba(239,68,68,.15);color:var(--danger);border:1px solid rgba(239,68,68,.3);}
.bdg.crit{background:rgba(251,146,60,.15);color:var(--orange);border:1px solid rgba(251,146,60,.3);}
.chev{color:var(--muted);font-size:14px;transition:transform .25s;margin-top:2px;}
.card.expanded .chev{transform:rotate(180deg);}
.stock-bar-wrap{padding:0 13px 8px;display:flex;align-items:center;gap:8px;}
.stock-bar-track{flex:1;height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;}
.stock-bar-fill{height:100%;border-radius:3px;}
.stock-bar-fill.ok{background:var(--green);}.stock-bar-fill.warn{background:var(--warn);}.stock-bar-fill.bad{background:var(--danger);}.stock-bar-fill.crit{background:var(--orange);}
.stock-bar-label{font-size:10px;color:var(--muted);white-space:nowrap;}
.cbody{display:none;border-top:1px solid var(--border);padding:12px 13px;}
.card.expanded .cbody{display:block;}
.stitle{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);font-weight:700;margin:10px 0 7px;display:flex;align-items:center;gap:6px;}
.stitle:first-child{margin-top:0;}
.stitle::after{content:'';flex:1;height:1px;background:var(--border);}
.igrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:8px;}
.icell{background:var(--surface);border-radius:8px;padding:7px 9px;}
.icell.full{grid-column:1/-1;}
.lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px;}
.val{font-size:12px;font-weight:600;}
.val.green{color:var(--green);}.val.warn{color:var(--warn);}.val.bad{color:var(--danger);}.val.blue{color:var(--blue);}
/* LOTES */
.lotes-list{display:flex;flex-direction:column;gap:6px;margin-bottom:8px;}
.lote-row{background:var(--surface);border-radius:9px;padding:9px 11px;display:flex;align-items:center;gap:10px;}
.lote-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.lote-dot.ok{background:var(--green);}.lote-dot.warn{background:var(--warn);}.lote-dot.bad{background:var(--danger);}.lote-dot.crit{background:var(--orange);}
.lote-info{flex:1;min-width:0;}
.lote-num{font-size:12px;font-weight:700;font-family:monospace;}
.lote-sub{font-size:10px;color:var(--muted);margin-top:2px;}
.lote-stock{font-size:13px;font-weight:800;flex-shrink:0;}
.lote-bar-track{height:4px;background:rgba(255,255,255,.07);border-radius:2px;margin-top:4px;overflow:hidden;}
.lote-bar-fill{height:100%;border-radius:2px;}
/* MOV TABLE */
.kmov-wrap{overflow-x:auto;margin-top:4px;}
table.kmov{width:100%;border-collapse:collapse;font-size:11px;min-width:520px;}
table.kmov th{background:rgba(255,255,255,.05);padding:6px 8px;text-align:left;font-size:9px;color:var(--muted);text-transform:uppercase;white-space:nowrap;}
table.kmov td{padding:6px 8px;border-top:1px solid var(--border);white-space:nowrap;}
table.kmov tr.entrada td:first-child{border-left:3px solid var(--green);}
table.kmov tr.pesaje td:first-child{border-left:3px solid var(--blue);}
table.kmov tr.baja td:first-child{border-left:3px solid var(--warn);}
.delta-pos{color:var(--green);font-weight:700;}.delta-neg{color:var(--danger);font-weight:700;}
.tipo-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;}
.tipo-badge.entrada{background:rgba(34,197,94,.15);color:var(--green);}
.tipo-badge.pesaje{background:rgba(59,157,255,.12);color:var(--blue);}
.tipo-badge.baja{background:rgba(245,158,11,.12);color:var(--warn);}
.tipo-badge.ajuste{background:rgba(167,139,250,.12);color:var(--purple);}
.cactions{display:flex;gap:7px;margin-top:10px;}
.btn-sm{padding:8px 12px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;border:none;flex:1;}
.btn-sm.entrada{background:rgba(34,197,94,.15);color:var(--green);border:1px solid rgba(34,197,94,.3);}
.btn-sm.pesaje{background:rgba(59,157,255,.12);color:var(--blue);border:1px solid rgba(59,157,255,.25);}
.btn-sm.edit{background:rgba(167,139,250,.12);color:var(--purple);border:1px solid rgba(167,139,250,.25);}
/* KARDEX FULL */
.mov-filter-row{display:flex;gap:6px;padding:8px 12px 0;overflow-x:auto;scrollbar-width:none;}
.mfil{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;white-space:nowrap;}
.mfil.active{background:var(--blue);color:#fff;border-color:var(--blue);}
.kexport-bar{display:flex;gap:8px;padding:8px 12px 0;flex-wrap:wrap;}
.btn-kexp{padding:8px 14px;border-radius:9px;font-size:11px;font-weight:700;cursor:pointer;border:none;white-space:nowrap;}
.btn-kexp.csv{background:rgba(34,197,94,.15);color:var(--green);border:1px solid rgba(34,197,94,.3);}
.btn-kexp.todo{background:rgba(245,158,11,.12);color:var(--warn);border:1px solid rgba(245,158,11,.3);}
.mes-picker{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin:8px 12px 0;display:none;}
.mes-picker.open{display:block;}
.mes-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px;}
.mes-btn{padding:7px 4px;border-radius:7px;font-size:11px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--muted);text-align:center;}
.mes-btn:hover{background:var(--accent);color:#0d1820;border-color:var(--accent);}
.year-row{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
.year-row button{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:4px 10px;cursor:pointer;}
.year-lbl{font-size:14px;font-weight:700;flex:1;text-align:center;}
.kmov-full-wrap{padding:10px 12px;overflow-x:auto;}
table.kmov-full{width:100%;border-collapse:collapse;font-size:11px;min-width:680px;}
table.kmov-full th{background:rgba(255,255,255,.05);padding:7px 8px;text-align:left;font-size:9px;color:var(--muted);text-transform:uppercase;white-space:nowrap;}
table.kmov-full td{padding:7px 8px;border-top:1px solid var(--border);}
.pager{display:flex;align-items:center;justify-content:center;gap:10px;padding:10px;font-size:12px;color:var(--muted);}
.pager button{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:6px 14px;cursor:pointer;font-size:12px;font-weight:700;}
.pager button:disabled{opacity:.3;cursor:not-allowed;}
/* MOV FORM */
.qmove{background:var(--card);border:1px solid var(--border);border-radius:14px;margin:12px;padding:14px;}
.qmove-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin-bottom:10px;}
.lote-selector{display:flex;flex-direction:column;gap:6px;margin-top:4px;}
.lote-opt{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--border);border-radius:10px;padding:10px 12px;cursor:pointer;transition:border-color .2s;}
.lote-opt:hover{border-color:var(--accent);}
.lote-opt.selected{border-color:var(--accent);background:rgba(0,194,160,.08);}
.lote-opt-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.lote-opt-info{flex:1;min-width:0;}
.lote-opt-num{font-size:13px;font-weight:700;font-family:monospace;}
.lote-opt-sub{font-size:10px;color:var(--muted);margin-top:2px;}
.lote-opt-stock{font-size:13px;font-weight:800;flex-shrink:0;text-align:right;}
.lote-opt-bar{height:3px;background:rgba(255,255,255,.07);border-radius:2px;margin-top:5px;overflow:hidden;}
.lote-opt-bar-fill{height:100%;border-radius:2px;}
.no-lotes-msg{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:10px;padding:12px;font-size:12px;color:var(--danger);text-align:center;}
/* PESO CALC */
.peso-calc{background:rgba(59,157,255,.07);border:1px solid rgba(59,157,255,.25);border-radius:10px;padding:12px;margin-top:8px;}
.peso-calc-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--blue);margin-bottom:8px;}
.peso-result{background:var(--surface);border-radius:8px;padding:10px;margin-top:8px;}
.peso-result-val{font-size:20px;font-weight:800;color:var(--accent);}
.peso-result-lbl{font-size:10px;color:var(--muted);margin-top:2px;}
/* STOCK PREVIEW */
.stock-preview{background:var(--surface);border-radius:10px;padding:12px;margin-top:8px;display:none;border:1px solid var(--border);}
.sp-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;font-weight:700;}
.sp-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
.sp-val{font-size:14px;font-weight:800;}
.sp-warn{font-size:11px;color:var(--danger);margin-top:6px;display:none;}
.move-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
.btn-move{padding:12px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;border:none;}
.btn-move:active{opacity:.8;}
.btn-move.entrada{background:rgba(34,197,94,.2);color:var(--green);border:1px solid rgba(34,197,94,.4);}
.btn-move.pesaje{background:rgba(59,157,255,.15);color:var(--blue);border:1px solid rgba(59,157,255,.3);}
.btn-move.baja{background:rgba(245,158,11,.15);color:var(--warn);border:1px solid rgba(245,158,11,.3);}
.btn-move.ajuste{background:rgba(167,139,250,.15);color:var(--purple);border:1px solid rgba(167,139,250,.3);}
/* MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:500;overflow-y:auto;}
.overlay.open{display:block;}
.modal{background:var(--card);border-radius:18px 18px 0 0;margin-top:40px;min-height:calc(100vh - 40px);}
.mhdr{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;position:sticky;top:0;background:var(--card);z-index:10;border-radius:18px 18px 0 0;}
.mhdr h2{flex:1;font-size:15px;font-weight:700;}
.btn-close{background:none;border:none;color:var(--muted);font-size:24px;cursor:pointer;}
.mbody{padding:14px;padding-bottom:100px;}
.fsep{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700;padding:8px 0 6px;border-bottom:1px solid var(--border);margin-bottom:10px;}
.mfoot{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--border);position:sticky;bottom:0;background:var(--card);}
.btn-primary{background:var(--accent);color:#0d1820;flex:1;padding:12px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;border:none;}
.btn-danger{background:rgba(239,68,68,.15);color:var(--danger);border:1px solid rgba(239,68,68,.3);padding:12px 16px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;}
.btn-ghost{background:var(--surface);color:var(--muted);border:1px solid var(--border);padding:12px 16px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;}
/* EDIT BUTTONS IN TABLE */
.bdg-edit{font-size:10px;font-weight:700;padding:2px 8px;border-radius:5px;background:rgba(59,157,255,.15);color:var(--blue);border:1px solid rgba(59,157,255,.3);cursor:pointer;}
.bdg-del{font-size:10px;font-weight:700;padding:2px 8px;border-radius:5px;background:rgba(239,68,68,.12);color:var(--danger);border:1px solid rgba(239,68,68,.25);cursor:pointer;margin-left:4px;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--accent);color:#0d1820;padding:10px 20px;border-radius:30px;font-weight:700;font-size:13px;z-index:999;transition:transform .3s;pointer-events:none;white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);}
.fab{position:fixed;bottom:20px;right:16px;width:52px;height:52px;border-radius:50%;background:var(--accent);color:#0d1820;font-size:26px;border:none;cursor:pointer;box-shadow:0 4px 20px rgba(0,194,160,.4);z-index:200;display:flex;align-items:center;justify-content:center;}
.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px;}
.hint{font-size:10px;color:var(--muted);margin-top:4px;line-height:1.5;}
</style>
</head>
<body>

<!-- LOADING -->
<div class="loading-screen" id="loading">
  <div class="spinner"></div>
  <div class="loading-title">⚗️ KARDEX Líquidos</div>
  <div class="loading-msg" id="loading-msg">Conectando con Firebase...</div>
  <div class="loading-err" id="loading-err"></div>
  <button class="btn-skip" id="btn-skip" onclick="document.getElementById('loading').classList.add('hidden')">Continuar sin conexión</button>
</div>

<!-- SYNC BAR -->
<div class="sync-bar">
  <div class="sync-dot" id="sync-dot"></div>
  <span class="sync-label" id="sync-label">Conectando...</span>
  <span class="sync-time" id="sync-time"></span>
</div>

<!-- NAV -->
<nav class="nav">
  <button class="nav-btn active" id="tab-dash"><span class="ico">📊</span>Dashboard</button>
  <button class="nav-btn" id="tab-inv"><span class="ico">⚗️</span>Inventario</button>
  <button class="nav-btn" id="tab-kardex"><span class="ico">📋</span>Kardex</button>
  <button class="nav-btn" id="tab-nuevo"><span class="ico">➕</span>Movimiento</button>
</nav>

<!-- DASHBOARD -->
<div class="panel active" id="panel-dash">
  <div class="hdr">
    <h1>⚗️ KARDEX Reactivos Líquidos / Pesables</h1>
    <p>LABORATORIO ANÁLISIS AMBIENTAL · ☁️ Tiempo real · mL</p>
    <div class="hdr-chips">
      <div class="chip">Reactivos: <b id="d-total">—</b></div>
      <div class="chip">Movimientos: <b id="d-movs">—</b></div>
      <div class="chip">Lotes activos: <b id="d-lotes">—</b></div>
    </div>
  </div>
  <div class="dash-grid" id="dash-grid"><div style="grid-column:1/-1;text-align:center;padding:30px;color:var(--muted)">Cargando...</div></div>
  <div class="alert-section">
    <div class="alert-title">🚨 Alertas prioritarias</div>
    <div id="alertas-list"></div>
  </div>
</div>

<!-- INVENTARIO -->
<div class="panel" id="panel-inv">
  <div class="hdr"><h1>⚗️ Inventario Reactivos Líquidos</h1><p>Stock en mL · Trazabilidad por lote/envase</p></div>
  <div class="srow"><div class="sw">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
    <input type="search" id="inv-q" placeholder="Buscar reactivo, código, clasificación…">
  </div></div>
  <div class="ftabs" id="inv-ftabs"></div>
  <div class="stats" id="inv-stats"></div>
  <div class="cards" id="inv-cards"></div>
  <div class="empty" id="inv-empty" style="display:none">Sin resultados</div>
  <button class="fab" id="fab-inv">＋</button>
</div>

<!-- KARDEX -->
<div class="panel" id="panel-kardex">
  <div class="hdr"><h1>📋 Kardex Líquidos</h1><p>Historial completo · Entradas · Pesajes · Bajas</p></div>
  <div class="srow"><div class="sw">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
    <input type="search" id="kard-q" placeholder="Buscar reactivo, lote, documento…">
  </div></div>
  <div class="mov-filter-row" id="mov-filters"></div>
  <div class="kexport-bar">
    <button class="btn-kexp csv" id="btn-exp-mes">📅 Exportar por mes</button>
    <button class="btn-kexp todo" id="btn-exp-todo">⬇️ Exportar todo (CSV)</button>
  </div>
  <div class="mes-picker" id="mes-picker">
    <div class="year-row">
      <button id="year-prev">◀</button>
      <div class="year-lbl" id="year-lbl">2026</div>
      <button id="year-next">▶</button>
    </div>
    <div class="mes-grid" id="mes-grid"></div>
  </div>
  <div class="kmov-full-wrap" id="kardex-table-wrap"></div>
  <div class="pager" id="kardex-pager"></div>
</div>

<!-- MOVIMIENTO -->
<div class="panel" id="panel-nuevo">
  <div class="hdr"><h1>➕ Registrar Movimiento</h1><p>Pesaje por peso · Se guarda en la nube ☁️</p></div>
  <div style="padding:12px">
    <div class="qmove">
      <div class="qmove-title">1️⃣ Selecciona el reactivo</div>
      <div class="form-row full"><div class="fg">
        <label class="flbl">Reactivo *</label>
        <select id="m-reactivo"><option value="">— Selecciona —</option></select>
      </div></div>

      <div id="lote-section" style="display:none;margin-top:10px">
        <div class="qmove-title">2️⃣ Selecciona el envase / lote</div>
        <div class="lote-selector" id="lote-selector"></div>
        <div class="form-row" style="margin-top:8px"><div class="fg">
          <label class="flbl">O ingresa lote nuevo (para Entradas)</label>
          <input type="text" id="m-lote-manual" placeholder="Ej: 8C24185-2">
        </div></div>
      </div>

      <div id="mov-section" style="display:none;margin-top:10px">
        <div class="qmove-title">3️⃣ Tipo de movimiento</div>
        <div class="form-row">
          <div class="fg"><label class="flbl">Fecha *</label><input type="date" id="m-fecha"></div>
          <div class="fg"><label class="flbl">Tipo *</label>
            <select id="m-tipo" onchange="onTipoChange()">
              <option value="ENTRADA">📥 Entrada (nuevo frasco)</option>
              <option value="PESAJE">⚖️ Pesaje (consumo por peso)</option>
              <option value="BAJA / VENCIMIENTO">⚠️ Baja / Vencimiento</option>
              <option value="AJUSTE">🔧 Ajuste</option>
            </select>
          </div>
        </div>

        <!-- PESAJE CALCULATOR -->
        <div id="pesaje-section" style="display:none">
          <div class="peso-calc">
            <div class="peso-calc-title">⚖️ Calculadora de Stock por Pesaje</div>
            <div class="form-row triple">
              <div class="fg"><label class="flbl">N° Frascos activos</label><input type="number" id="m-nfrascos" min="1" value="1" oninput="calcPesaje()"></div>
              <div class="fg"><label class="flbl">Tara 1 frasco (g)</label><input type="number" id="m-tara" step="0.1" oninput="calcPesaje()" placeholder="0.0"></div>
              <div class="fg"><label class="flbl">Densidad (g/mL)</label><input type="number" id="m-densidad" step="0.001" oninput="calcPesaje()" placeholder="1.000"></div>
            </div>
            <div class="form-row full"><div class="fg">
              <label class="flbl">Peso total + envase(s) (g) *</label>

function setMsg(m){const e=document.getElementById('loading-msg');if(e)e.textContent=m;}
function setErr(m){const e=document.getElementById('loading-err');const s=document.getElementById('btn-skip');if(e){e.textContent=m;e.style.display='';}if(s)s.style.display='';}
function setSyncStatus(status,msg){
  const dot=document.getElementById('sync-dot');const lbl=document.getElementById('sync-label');
  if(!dot||!lbl)return;
  dot.className='sync-dot '+status;lbl.textContent=msg;
  if(status==='online'){document.getElementById('sync-time').textContent='Actualizado: '+new Date().toLocaleTimeString('es-EC',{hour:'2-digit',minute:'2-digit'});}
}
function toast(msg,color){
  const t=document.getElementById('toast');
  t.textContent=msg;t.style.background=color||'var(--accent)';t.style.color=color?'#fff':'#0d1820';
  t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);
}
function hoy(){return new Date().toISOString().slice(0,10);}
function fmtDate(s){if(!s)return'—';if(s.includes('/'))return s;try{const[y,m,d]=s.split('-');return`${d}/${m}/${y}`;}catch(e){return s;}}
function fechaOrden(f){
  if(!f)return 0;
  if(typeof f!=='string'){const d=new Date(f);return isNaN(d)?0:d.getTime();}
  const s=f.trim();
  if(s.includes('/')){const p=s.split('/');if(p.length===3)return new Date(Number(p[2]),Number(p[1])-1,Number(p[0])).getTime();}
  if(s.includes('-')){const p=s.split('-');if(p.length===3)return new Date(Number(p[0]),Number(p[1])-1,Number(p[2])).getTime();}
  const d=new Date(s);return isNaN(d)?0:d.getTime();
}
function safeN(v,d=0){try{const n=parseFloat(v);return isNaN(n)?d:Math.round(n*100)/100;}catch(e){return d;}}
function stockStatus(item){
  const s=safeN(item.stock),mn=safeN(item.stock_min);
  if(s<=0)return'bad';
  if(mn>0&&s<mn*0.5)return'crit';
  if(mn>0&&s<mn)return'warn';
  return'ok';
}
function stockBdg(item){
  const st=stockStatus(item);
  const labels={ok:'✅ OK',warn:'🟡 Solicitar',crit:'🔴 Crítico',bad:'⛔ Sin stock'};
  return`<div class="bdg ${st}">${labels[st]}</div>`;
}
function loteColor(st){return{ok:'var(--green)',warn:'var(--warn)',crit:'var(--orange)',bad:'var(--danger)'}[st]||'var(--muted)';}
function loteStatus(saldo,inicial){
  const s=safeN(saldo);if(s<=0)return'bad';
  const p=safeN(inicial)>0?s/safeN(inicial):1;
  if(p<0.2)return'crit';if(p<0.5)return'warn';return'ok';
}
function tipoClass(t){
  const tl=(t||'').toLowerCase();
  if(tl.includes('entrada'))return'entrada';
  if(tl.includes('pesaje'))return'pesaje';
  if(tl.includes('baja'))return'baja';
  return'ajuste';
}

function recalcFromMovs(){
  const loteSaldoMap={};
  const codigoSaldoMap={};
  const entMap={};const salMap={};
  [...MOVS].sort((a,b)=>fechaOrden(a.fecha)-fechaOrden(b.fecha)).forEach(m=>{
    const cod=m.codigo;if(!cod)return;
    if(!entMap[cod])entMap[cod]=0;if(!salMap[cod])salMap[cod]=0;
    const t=(m.tipo||'').toLowerCase();
    if(t.includes('entrada'))entMap[cod]+=safeN(m.entrada_ml);
    else salMap[cod]+=safeN(m.consumo_ml);
    if(m.stock_acum!==undefined&&m.stock_acum!==null)codigoSaldoMap[cod]=safeN(m.stock_acum);
    if(m.clave){
      loteSaldoMap[m.clave]={saldo:safeN(m.stock_ml),lote:m.lote,codigo:cod,reactivo:m.reactivo,fecha:m.fecha};
    }
  });
  INV.forEach(item=>{
    const cod=item.codigo;
    if(codigoSaldoMap[cod]!==undefined)item.stock=codigoSaldoMap[cod];
    item.entradas=entMap[cod]||item.entradas||0;
    item.consumo=salMap[cod]||item.consumo||0;
  });
  LOTES={};
  Object.entries(SEED_LOTES).forEach(([cod,seedLotes])=>{
    LOTES[cod]=seedLotes.map(sl=>({
      ...sl,
      saldo:safeN(loteSaldoMap[sl.clave]?.saldo??sl.saldo??0),
      fecha_ultimo:loteSaldoMap[sl.clave]?.fecha||sl.fecha_ultimo||'',
      agotado:safeN(loteSaldoMap[sl.clave]?.saldo??sl.saldo??0)<=0
    }));
    LOTES[cod].sort((a,b)=>(a.agotado?1:0)-(b.agotado?1:0)||b.saldo-a.saldo);
  });
  // Add new claves from movements not in seed (handled inside recalcFromMovs)
  Object.entries(loteSaldoMap).forEach(([clave,data])=>{
    const cod=data.codigo;
    if(!LOTES[cod])LOTES[cod]=[];
    // Check by clave OR by lote number to avoid duplicates from legacy data
    const existsByClave=LOTES[cod].find(l=>l.clave===clave);
    const existsByLote=LOTES[cod].find(l=>l.lote===data.lote);
    if(!existsByClave&&!existsByLote&&safeN(data.saldo)>0){
      LOTES[cod].push({clave,lote:data.lote,saldo:safeN(data.saldo),fecha_ultimo:data.fecha,presentacion:'',densidad:1,tara_g:0,frasco_ml:0,stock_inicial:0,agotado:false});
      LOTES[cod].sort((a,b)=>(a.agotado?1:0)-(b.agotado?1:0)||b.saldo-a.saldo);
    }
  });

  // Recalcula otra vez al final para incluir lotes nuevos creados desde movimientos
  INV.forEach(item=>{
    const myLotes=LOTES[item.codigo]||[];
    const sumActivos=myLotes.filter(l=>!l.agotado).reduce((a,l)=>a+safeN(l.saldo),0);
    if(myLotes.length>0)item.stock=Math.round(sumActivos*100)/100;
  });
}

  if(id==='dash')renderDash();

}

// ====== DASHBOARD ======
function renderDash(){
  const ok=INV.filter(i=>stockStatus(i)==='ok').length;
  const warn=INV.filter(i=>stockStatus(i)==='warn').length;
  const crit=INV.filter(i=>stockStatus(i)==='crit').length;
  const bad=INV.filter(i=>stockStatus(i)==='bad').length;
  const totalLotes=Object.values(LOTES).reduce((a,v)=>a+v.filter(l=>!l.agotado).length,0);
  document.getElementById('d-total').textContent=INV.length;
  document.getElementById('d-movs').textContent=MOVS.length;
  document.getElementById('d-lotes').textContent=totalLotes;
  document.getElementById('dash-grid').innerHTML=`
    <div class="dash-card"><div class="dash-num ok">${ok}</div><div class="dash-lbl">✅ Stock OK</div></div>
    <div class="dash-card"><div class="dash-num warn">${warn}</div><div class="dash-lbl">🟡 Solicitar</div></div>
    <div class="dash-card"><div class="dash-num bad">${crit}</div><div class="dash-lbl">🔴 Crítico</div></div>
    <div class="dash-card"><div class="dash-num bad">${bad}</div><div class="dash-lbl">⛔ Sin stock</div></div>
    <div class="dash-card"><div class="dash-num blue">${totalLotes}</div><div class="dash-lbl">📦 Envases activos</div></div>
    <div class="dash-card"><div class="dash-num white">${MOVS.length}</div><div class="dash-lbl">📋 Movimientos</div></div>
    <div class="dash-card"><div class="dash-num blue">${INV.length}</div><div class="dash-lbl">⚗️ Reactivos</div></div>
    <div class="dash-card"><div class="dash-num white">${INV.filter(i=>i.clasificacion==='Inflamable').length}</div><div class="dash-lbl">🔥 Inflamables</div></div>`;
  const alerts=INV.filter(i=>['crit','warn','bad'].includes(stockStatus(i))).sort((a,b)=>safeN(a.stock)-safeN(b.stock));
  const al=document.getElementById('alertas-list');
  if(!alerts.length){al.innerHTML='<div class="empty">✅ Sin alertas — todos los stocks están bien</div>';return;}
  al.innerHTML=alerts.map(i=>{
    const st=stockStatus(i);
    const pct=safeN(i.stock_min)>0?Math.round((safeN(i.stock)/safeN(i.stock_min))*100):0;
    const icon=CLASIF_ICONS[i.clasificacion]||'⚗️';
    return`<div class="alert-item ${st==='bad'||st==='crit'?'critical':''}">
      <div class="alert-ico">${icon}</div>
      <div class="alert-info">
        <div class="alert-name">${i.reactivo}</div>
        <div class="alert-sub">${i.codigo} · Mín: ${i.stock_min} mL · ${pct}% · ${i.ubicacion||'—'}</div>
      </div>
      <div class="alert-stock ${st==='bad'||st==='crit'?'bad':'warn'}">${safeN(i.stock).toFixed(1)} mL</div>
    </div>`;
  }).join('');
}

function renderKardex(){
  const q=(document.getElementById('kard-q').value||'').toLowerCase();
  const filtered=MOVS.filter(m=>{
    const fOk=kardexFilter==='Todos'||m.tipo===kardexFilter;
    const qOk=!q||(m.reactivo||'').toLowerCase().includes(q)||(m.codigo||'').toLowerCase().includes(q)||(m.lote||'').toLowerCase().includes(q)||(m.doc||'').toLowerCase().includes(q);
    return fOk&&qOk;
  });
  filtered.sort((a,b)=>fechaOrden(b.fecha)-fechaOrden(a.fecha));
  const total=filtered.length;
  const page=filtered.slice(kardexPage*PER_PAGE,(kardexPage+1)*PER_PAGE);
  const wrap=document.getElementById('kardex-table-wrap');

  wrap.innerHTML=`<table class="kmov-full">
    <thead><tr><th>Fecha</th><th>Reactivo</th><th>Lote</th><th>Tipo</th><th>Stock mL</th><th>Consumo mL</th><th>Peso (g)</th><th>N°Fr.</th><th>Doc.</th><th>Resp.</th><th></th></tr></thead>
    <tbody>${page.map(m=>{
      const tc=tipoClass(m.tipo);
      const fid=m._fid||'';
      return`<tr>
        <td>${m.fecha}</td>
        <td style="font-weight:600;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${m.reactivo}</td>
        <td><code style="color:var(--purple)">${m.lote}</code></td>
        <td><span class="tipo-badge ${tc}">${m.tipo}</span></td>
        <td style="font-weight:700;color:var(--accent)">${safeN(m.stock_ml).toFixed(1)}</td>
        <td style="color:${safeN(m.consumo_ml)>0?'var(--danger)':'var(--muted)'}">${safeN(m.consumo_ml)>0?'-'+safeN(m.consumo_ml).toFixed(1):'—'}</td>
        <td style="color:var(--muted)">${safeN(m.peso_total)>0?safeN(m.peso_total).toFixed(1)+'g':'—'}</td>
        <td style="color:var(--muted)">${m.n_frascos||'—'}</td>
        <td style="color:var(--muted);font-size:10px">${m.doc||'—'}</td>
        <td style="color:var(--muted)">${m.responsable}</td>
        <td style="white-space:nowrap">
          <button class="bdg-edit" onclick="openEditMov('${fid}')">✏️</button>
          <button class="bdg-del"  onclick="confirmDelMov('${fid}','${(m.reactivo||'').replace(/'/g,"\'")}')">🗑</button>
        </td>
      </tr>`;
    }).join('')}</tbody></table>`;
  const totalPages=Math.ceil(total/PER_PAGE);
  const pager=document.getElementById('kardex-pager');pager.innerHTML='';
  const prev=document.createElement('button');prev.textContent='◀';prev.disabled=kardexPage===0;prev.addEventListener('click',()=>{kardexPage--;renderKardex();});
  const info=document.createElement('span');info.textContent=`Pág ${kardexPage+1} / ${totalPages} · ${total} registros`;
  const next=document.createElement('button');next.textContent='▶';next.disabled=kardexPage>=totalPages-1;next.addEventListener('click',()=>{kardexPage++;renderKardex();});
  pager.append(prev,info,next);
}

  });
